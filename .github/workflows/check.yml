name: Production checks (no deployment)
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - "127.0.0.1:55432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m pytest backend -q --junitxml=production-tests.xml
        env:
          EAA_REHEARSAL_TESTS: "yes"
          ADVENTURE_CLOUD_ENABLE: "no"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm run build:netlify --prefix frontend
        env:
          BACKEND_ORIGIN: https://example-adventure-api.onrender.com
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-check-evidence
          path: production-tests.xml
      - name: Build production Docker image
        run: docker build --tag english-ai-adventure:ci .
      - name: Verify Docker maintenance startup without cloud secrets
        run: |
          docker run -d --name adventure-ci -p 8000:8000 -e PORT=8000 -e ADVENTURE_ENV=production -e ADVENTURE_DATA_DIR=/tmp/eaa-ci -e ADVENTURE_MAINTENANCE=1 -e ADVENTURE_ALLOWED_HOSTS=127.0.0.1 -e ADVENTURE_ALLOWED_ORIGINS=https://example.netlify.app english-ai-adventure:ci
          for i in $(seq 1 30); do
            if curl --fail http://127.0.0.1:8000/api/health; then exit 0; fi
            sleep 2
          done
          docker logs adventure-ci
          exit 1
