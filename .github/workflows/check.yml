name: Production checks (no deployment)
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt
      - run: pip install -r backend/requirements.lock.txt
      - run: python -m pytest backend/test_production.py -q --junitxml=production-tests.xml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm run build:netlify --prefix frontend
        env:
          BACKEND_ORIGIN: https://example-adventure-api.onrender.com
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-check-evidence
          path: production-tests.xml
